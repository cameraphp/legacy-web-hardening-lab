# LAB ONLY: origin virtual host (REQ-ORIGIN-001, REQ-FWD-003).
# Lab assumption: this origin is reached only through TLS terminated at the Nginx edge (172.28.0.2).
# That assumption is enforced below at connection level, and it is why PHP may set the Secure cookie
# flag although this internal hop is plain HTTP.
<VirtualHost *:80>
    ServerName origin.lab.internal
    DocumentRoot /var/www/lab/public
    DirectoryIndex index.php

    # Trust forwarding headers only from the edge's fixed internal address.
    # RemoteIPInternalProxy (not TrustedProxy) because lab client addresses are private ranges.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.28.0.2

    # HTTPS context only when the TCP peer is the edge AND the edge asserted https.
    SetEnvIfExpr "%{CONN_REMOTE_ADDR} == '172.28.0.2' && %{HTTP:X-Forwarded-Proto} == 'https'" HTTPS=on LAB_VIA_EDGE=1

    Alias /health /var/www/lab/public/health.php
    Alias /session /var/www/lab/public/session.php
    Alias /lab/request-context /var/www/lab/public/lab-request-context.php

    <Directory /var/www/lab/public>
        Options None
        AllowOverride None
        # Why not "Require ip 172.28.0.2": mod_remoteip rewrites the client address from
        # X-Forwarded-For BEFORE authorization, so "Require ip" would compare the forwarded client
        # address and deny all legitimate edge traffic. CONN_REMOTE_ADDR is the real TCP peer, so
        # only the edge's fixed IP passes, and a forged X-Forwarded-For can't satisfy it.
        Require expr "%{CONN_REMOTE_ADDR} == '172.28.0.2'"
        php_admin_value open_basedir "/var/www/lab:/var/lib/lab:/tmp"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogLevel warn
    CustomLog ${APACHE_LOG_DIR}/access.log lab_origin
</VirtualHost>
