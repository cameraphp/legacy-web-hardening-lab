# LAB ONLY: server-wide Apache hardening for the origin (REQ-ORIGIN-002).
ServerName origin.lab.internal
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
Timeout 15
KeepAliveTimeout 5
LimitRequestBody 16384
LimitRequestFields 50
LimitRequestFieldSize 8190

<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/>
    Options None
    AllowOverride None
    Require all denied
</Directory>

Header always unset X-Powered-By
Header unset X-Powered-By

# Generic error bodies: no version, path or module details.
ErrorDocument 400 "Bad Request"
ErrorDocument 403 "Forbidden"
ErrorDocument 404 "Not Found"
ErrorDocument 405 "Method Not Allowed"
ErrorDocument 500 "Internal Server Error"
ErrorDocument 503 "Service Unavailable"

# %a = client address after mod_remoteip; %{c}a = TCP peer. No user agent, referer or cookies.
LogFormat "%a peer=%{c}a \"%r\" %>s %b" lab_origin
