# LAB ONLY: fictional local hardening demonstration; do not use with client data or production systems.
# Cloudflare-style edge/origin separation and header sanitation only. No Cloudflare product is used.
# Requirements: REQ-EDGE-001..007, REQ-FWD-001..002.

user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    server_tokens off;                 # REQ-EDGE-004: "Server: nginx" without a version
    default_type text/plain;
    charset utf-8;
    charset_types text/plain;

    # Minimal access log: no query strings, cookies, user agents or header values.
    log_format lab '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout lab;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;

    # REQ-EDGE-001: TLS terminates here with an ephemeral self-signed certificate (see entrypoint.sh).
    ssl_certificate     /run/lab-tls/lab.crt;
    ssl_certificate_key /run/lab-tls/lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:LabTLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # REQ-EDGE-003: limited, compatible response headers. They are defined only here (http level) so
    # every server and location inherits them, including error responses ("always").
    # HSTS is deliberately omitted: a persistent HSTS policy on "localhost" would pin unrelated local
    # services to HTTPS in the browser, and the certificate here is self-signed and regenerated each start.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # REQ-EDGE-004: hide origin implementation details and avoid duplicate security headers.
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;

    upstream lab_origin {
        server 172.28.0.10:80;         # origin's fixed address on the internal origin_net
        keepalive 8;
    }

    # REQ-EDGE-002: default server. Any Host that isn't allowlisted gets a deterministic 421 and is
    # never proxied to the origin.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        return 421 "Misdirected Request: unexpected Host for this lab edge.\n";
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost 127.0.0.1;

        # REQ-EDGE-005: GET and HEAD only. TRACE and everything else get 405.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 "Method Not Allowed\n";
        }

        location / {
            proxy_pass http://lab_origin;
            proxy_http_version 1.1;
            proxy_redirect off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            # REQ-FWD-001: forward NO client request headers by default (allowlist, not denylist).
            # Client-supplied Forwarded, X-Forwarded-*, X-Real-IP, CF-Connecting-IP, True-Client-IP
            # and every other header are dropped here.
            proxy_pass_request_headers off;

            # Allowlisted pass-through headers needed by the lab application.
            proxy_set_header Cookie          $http_cookie;
            proxy_set_header User-Agent      $http_user_agent;
            proxy_set_header Accept          $http_accept;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header Connection      "";

            # REQ-FWD-002: forwarding context rebuilt from what this edge observed. These values
            # overwrite, never append to, anything the client sent.
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port  443;
            proxy_set_header X-Forwarded-Host  $host;
        }
    }
}
