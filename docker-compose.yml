# LAB ONLY: fictional local hardening demonstration; do not use with client data or production systems.
# Spec: specs/2026-10-31-legacy-web-hardening/ (REQ-ARCH-001..005)
# The only host-published port is edge 127.0.0.1:8443 -> 443. Origin publishes nothing.
name: legacy-web-hardening-lab

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: "no"

services:
  edge:
    <<: *hardening
    build:
      context: ./docker/edge
    image: legacy-web-hardening-lab/edge:local
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx
    ports:
      - "127.0.0.1:8443:443"
    networks:
      edge_net:
        aliases:
          - lab-edge
      origin_net:
        ipv4_address: 172.28.0.2
    depends_on:
      origin:
        condition: service_healthy

  origin:
    <<: *hardening
    build:
      context: ./docker/origin
    image: legacy-web-hardening-lab/origin:local
    cap_add:
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/lib/lab/sessions:uid=33,gid=33,mode=0700
    volumes:
      - type: volume
        source: legacy_state
        target: /var/lib/lab/state
        read_only: true
    networks:
      origin_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      # Healthy = Apache answers AND refuses this non-edge (loopback) peer with 403. Each probe is
      # therefore logged as an expected authz denial; the steady-state interval is kept long.
      test: ["CMD", "php", "/opt/lab/bin/healthcheck.php"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s

  tester:
    <<: *hardening
    profiles: ["tools"]
    build:
      context: ./docker/tester
    image: legacy-web-hardening-lab/tester:local
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      edge_net: {}
      origin_net:
        ipv4_address: 172.28.0.20

  backup:
    <<: *hardening
    profiles: ["tools"]
    build:
      context: ./docker/backup
    image: legacy-web-hardening-lab/backup:local
    read_only: true
    tmpfs:
      - /tmp
    network_mode: none
    volumes:
      - type: volume
        source: legacy_state
        target: /lab/state
        read_only: true
      - type: volume
        source: lab_backups
        target: /lab/backups

  migrator:
    <<: *hardening
    profiles: ["tools"]
    build:
      context: ./docker/origin
    image: legacy-web-hardening-lab/origin:local
    entrypoint: ["php", "/opt/lab/bin/migrate.php"]
    read_only: true
    tmpfs:
      - /tmp
    network_mode: none
    volumes:
      - type: volume
        source: legacy_state
        target: /var/lib/lab/state
      - type: volume
        source: lab_backups
        target: /lab/backups
        read_only: true

networks:
  edge_net:
    driver: bridge
  origin_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  legacy_state:
  lab_backups:
